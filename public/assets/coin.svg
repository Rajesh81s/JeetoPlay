<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFC107"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#B8860B" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="12" cy="12" r="11" fill="url(#coinGrad)" filter="url(#shadow)" stroke="#DAA520" stroke-width="0.8"/>
  <!-- Inner ring -->
  <circle cx="12" cy="12" r="8.5" fill="none" stroke="#DAA520" stroke-width="0.6" opacity="0.7"/>
  <!-- J letter -->
  <text x="12" y="16.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="12" fill="#B8860B" opacity="0.9">J</text>
  <!-- Shine -->
  <ellipse cx="8" cy="7" rx="4" ry="3" fill="url(#shineGrad)" transform="rotate(-30 8 7)"/>
</svg>
