<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Complete - JeetoPlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 40px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(74, 222, 128, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 20px;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #4ade80;
            margin-bottom: 10px;
        }

        .message {
            font-size: 0.95rem;
            color: #9ca3af;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            border: none;
            border-radius: 12px;
            color: #0f172a;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #9ca3af;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">✓</div>
        <div class="title">Payment Successful!</div>
        <div class="message">
            Your wallet has been credited.<br>
            Tap below to see your updated balance.
        </div>
        <button class="btn" onclick="goToWallet()">View Wallet Balance</button>
        <button class="btn btn-secondary" onclick="tryClose()">Close This Tab</button>
    </div>

    <script>
        // Mark payment as completed in localStorage (matches Universal Payment Modal key)
        const pending = localStorage.getItem('pending_deposit_txn');
        if (pending) {
            try {
                const data = JSON.parse(pending);
                data.callbackReceived = true;
                data.completedAt = Date.now();
                localStorage.setItem('pending_deposit_txn', JSON.stringify(data));
            } catch (e) { }
        }

        function goToWallet() {
            // Go directly to wallet section using hash
            window.location.href = '/app.html#wallet';
        }

        function tryClose() {
            window.close();
            // If still here after 500ms, go to wallet
            setTimeout(goToWallet, 500);
        }

        // Auto-redirect to wallet after 3 seconds for mobile users
        setTimeout(goToWallet, 3000);
    </script>
</body>

</html>
